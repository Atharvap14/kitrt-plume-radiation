%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
% KiT-RT PlumeRadiation CPU example    %
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

OUTPUT_DIR = ../../result
OUTPUT_FILE = plume_radiation_cpu
LOG_DIR = ../../result/logs

PROBLEM = PLUME_RADIATION
SOLVER = PLUME_DTM_SOLVER
PLUME_BACKEND = CPU

% For real plume data, set PLUME_SYNTHETIC_FIELD = NO and provide PLUME_FIELD_FILE.
PLUME_SYNTHETIC_FIELD = YES
PLUME_SYNTHETIC_TEMPERATURE_K = 1200.0
PLUME_SYNTHETIC_KAPPA_1_PER_M = 0.1
PLUME_SYNTHETIC_Z_MAX_M = 5.0
PLUME_SYNTHETIC_R_MAX_M = 5.0
PLUME_SYNTHETIC_Z_CELLS = 32
PLUME_SYNTHETIC_R_CELLS = 32

PLUME_BASE_Z_M = 0.0
PLUME_BASE_RADIUS_M = 1.0
PLUME_BASE_SAMPLES = 25
PLUME_RAY_POLAR_SAMPLES = 24
PLUME_RAY_AZIMUTH_SAMPLES = 48
PLUME_RAY_STEP_M = 0.01
PLUME_RAY_MAX_DISTANCE_M = 5.0
PLUME_WRITE_VTK = YES

VOLUME_OUTPUT = ( MINIMAL )
SCREEN_OUTPUT = ( ITER )
HISTORY_OUTPUT = ( ITER )
