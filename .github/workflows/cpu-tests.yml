name: CPU Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  cpu-tests:
    runs-on: ubuntu-22.04
    env:
      OMP_NUM_THREADS: 1
      OMP_DYNAMIC: FALSE
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            g++ \
            libblas-dev \
            liblapack-dev \
            libopenblas-dev \
            libomp-dev \
            libvtk9-dev \
            ninja-build

      - name: Configure CPU build
        run: |
          cmake -G Ninja -S . -B build_cpu \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_CUDA_HPC=OFF \
            -DBUILD_HIP_HPC=OFF \
            -DBUILD_MPI=OFF \
            -DBUILD_TESTING=ON \
            -DBUILD_GUI=OFF \
            -DBUILD_DOC=OFF \
            -DBUILD_ML=OFF

      - name: Build
        run: cmake --build build_cpu --parallel 2

      - name: Run tests
        run: |
          while true; do
            echo "CTest still running at $(date -u +%H:%M:%S)"
            sleep 60
          done &
          heartbeat=$!
          trap 'kill "${heartbeat}"' EXIT
          ctest --test-dir build_cpu --output-on-failure --timeout 900
